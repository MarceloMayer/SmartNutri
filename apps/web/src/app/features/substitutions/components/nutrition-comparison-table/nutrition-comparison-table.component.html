<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Nutriente</th>
        <th>Referencia</th>
        <th>Substituto</th>
        <th>Diferenca</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <th scope="row">{{ row.label }}</th>
        <td data-label="Referencia">{{ formatValue(row.baseValue, row.unit) }}</td>
        <td data-label="Substituto">{{ formatValue(row.substituteValue, row.unit) }}</td>
        <td data-label="Diferenca">{{ formatDifference(row) }}</td>
      </tr>
    </tbody>
  </table>
</div>
