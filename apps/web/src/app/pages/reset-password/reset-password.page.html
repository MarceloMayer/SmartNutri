<section class="reset-password-page">
  <form class="reset-password-form" (submit)="resetPassword(); $event.preventDefault()">
    <div class="reset-password-form__header">
      <p>Smart Nutri</p>
      <h1>Redefinir senha</h1>
    </div>

    <ng-container *ngIf="token; else missingToken">
      <label class="field">
        <span>Nova senha</span>
        <input
          type="password"
          autocomplete="new-password"
          [formControl]="passwordControl"
        />
        <small *ngIf="showPasswordError">Use entre 6 e 128 caracteres.</small>
      </label>

      <label class="field">
        <span>Confirmar nova senha</span>
        <input
          type="password"
          autocomplete="new-password"
          [formControl]="confirmPasswordControl"
        />
        <small *ngIf="showConfirmPasswordError">Confirme a senha.</small>
        <small *ngIf="confirmMismatch && !showConfirmPasswordError">As senhas não coincidem.</small>
      </label>

      <div class="state-message state-message--error" role="status" aria-live="polite" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button class="primary-action" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Salvando...' : 'Redefinir senha' }}
      </button>
    </ng-container>

    <ng-template #missingToken>
      <div class="state-message state-message--error" role="status" aria-live="polite">
        Link de redefinição inválido ou incompleto.
      </div>
    </ng-template>

    <p class="reset-password-form__footer">
      <a routerLink="/esqueci-senha">Solicitar novo link</a>
    </p>
  </form>
</section>
