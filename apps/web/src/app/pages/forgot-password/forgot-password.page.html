<section class="forgot-password-page">
  <form class="forgot-password-form" (submit)="requestReset(); $event.preventDefault()" *ngIf="!isSubmitted">
    <div class="forgot-password-form__header">
      <p>Smart Nutri</p>
      <h1>Esqueci minha senha</h1>
      <p class="forgot-password-form__hint">Informe seu email e enviaremos um link para redefinir sua senha.</p>
    </div>

    <label class="field">
      <span>Email</span>
      <input
        type="email"
        autocomplete="email"
        [formControl]="emailControl"
      />
      <small *ngIf="showEmailError">Informe um email válido.</small>
    </label>

    <div class="state-message state-message--error" role="status" aria-live="polite" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button class="primary-action" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Enviando...' : 'Enviar link de recuperação' }}
    </button>

    <p class="forgot-password-form__footer">
      Lembrou a senha?
      <a routerLink="/login">Entrar</a>
    </p>
  </form>

  <div class="forgot-password-form" *ngIf="isSubmitted">
    <div class="forgot-password-form__header">
      <p>Smart Nutri</p>
      <h1>Verifique seu email</h1>
    </div>

    <div class="state-message" role="status" aria-live="polite">
      Se este email estiver cadastrado, você receberá um link para redefinir sua senha em instantes.
    </div>

    <p class="forgot-password-form__footer">
      <a routerLink="/login">Voltar para o login</a>
    </p>
  </div>
</section>
